name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and diagnose runner display
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\runner-display.ps1 -Prepare
      - name: Build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1
      - name: Application tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test.ps1
      - name: Preserve render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-evidence
          path: artifacts/renders/*.png
          if-no-files-found: warn
